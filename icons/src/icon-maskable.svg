<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Augury">
<title>Augury — the lituus seal</title>
<!-- Purpose: maskable. The seal (276px, diagonal 390px) sits inside the
     central 80% safe zone (410px circle), rotation included.
     The lituus in paper on red ink (#9b2a1a), stamped on warm paper
     (#f3ece0): full-bleed, no transparency. See icon.svg. -->
<defs>
<radialGradient id="paper" cx="50%" cy="42%" r="78%">
<stop offset="0" stop-color="#faf4e8"/><stop offset="0.62" stop-color="#f3ece0"/><stop offset="1" stop-color="#e6d9c3"/>
</radialGradient>
<linearGradient id="seal" x1="0" y1="0" x2="1" y2="1">
<stop offset="0" stop-color="#a8331f"/><stop offset="0.55" stop-color="#9b2a1a"/><stop offset="1" stop-color="#842315"/>
</linearGradient>
<filter id="rough" x="-4%" y="-4%" width="108%" height="108%">
<feTurbulence type="fractalNoise" baseFrequency="0.032" numOctaves="3" seed="7" result="n"/>
<feDisplacementMap in="SourceGraphic" in2="n" scale="7"/>
</filter>
<filter id="grain" x="0%" y="0%" width="100%" height="100%">
<feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="2" seed="11"/>
<feColorMatrix type="matrix" values="0 0 0 0 0.42 0 0 0 0 0.36 0 0 0 0 0.26 0 0 0 0.05 0"/>
</filter>
<filter id="mottle" x="0%" y="0%" width="100%" height="100%">
<feTurbulence type="fractalNoise" baseFrequency="0.012 0.016" numOctaves="3" seed="4"/>
<feColorMatrix type="matrix" values="0 0 0 0 0.96 0 0 0 0 0.94 0 0 0 0 0.90 0 0 0 0.10 0"/>
</filter>
<clipPath id="sealClip"><rect x="118" y="118" width="276" height="276" rx="16"/></clipPath>
</defs>
<rect width="512" height="512" fill="url(#paper)"/>
<rect width="512" height="512" filter="url(#grain)"/>
<g transform="rotate(-2 256 256)">
<rect x="118" y="118" width="276" height="276" rx="16" fill="url(#seal)" filter="url(#rough)"/>
<g clip-path="url(#sealClip)"><rect x="118" y="118" width="276" height="276" filter="url(#mottle)"/></g>
<g transform="translate(118 118) scale(2.76)"><path d="M50 86 L50 36 Q50 16 67 16 Q82 16 82 28 Q82 39 71 39" fill="none" stroke="#f3ece0" stroke-width="6.5" stroke-linecap="round"/></g>
</g>
</svg>
