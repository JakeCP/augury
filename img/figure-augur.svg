<path d="M63 373 Q124 395 185 369" fill="none" stroke="#a83a22" stroke-width="3"/>
<path d="M64 414 Q125 436 185 412 L186 426 Q125 450 65 428Z" fill="#71313f"/>
<path d="M65 432 Q125 454 186 430" fill="none" stroke="#a83a22" stroke-width="2.6"/>
