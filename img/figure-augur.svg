<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 600" role="img" aria-label="A Roman augur, head veiled, raising the lituus to mark the sky">
<title>An augur in the trabea, capite velato, raising the lituus</title>
<!-- Original hand-built figure panel: an augur on a Pompeian red
     ground, in the striped trabea, head veiled with a fold of the
     toga, the lituus raised toward the sky. Painted in flat tones
     with dark outlines, in the manner of a red-ground wall panel;
     copied from no wall. -->
<defs>
<radialGradient id="glow" cx=".48" cy=".4" r=".78">
<stop offset="0" stop-color="#a53822"/><stop offset=".55" stop-color="#97331f"/><stop offset="1" stop-color="#8f2a1c"/>
</radialGradient>
<filter id="grain" x="0" y="0" width="100%" height="100%">
<feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="2" stitchTiles="stitch" result="n"/>
<feColorMatrix in="n" type="matrix" values="0 0 0 0 .23  0 0 0 0 .17  0 0 0 0 .1  0 0 0 .06 0"/>
</filter>
<clipPath id="drape"><path d="M102 126 Q84 130 76 146 Q68 172 70 224 Q66 296 70 362 Q66 428 70 468 Q71 484 88 485 L168 486 Q182 485 181 468 Q178 398 176 330 Q172 250 165 190 Q161 150 148 136 L134 127 Q118 137 102 126Z"/></clipPath>
</defs>
<ellipse cx="127" cy="563" rx="63" ry="8" fill="#5f1c11" opacity=".42"/>
<path d="M24 96 Q32 88 39 94 Q42 90 46 94 Q53 88 60 96 Q52 93 44 99 Q42 100.5 40 99 Q32 93 24 96Z" fill="#f3e3c2" opacity=".65"/>
<g stroke="#4a2413" stroke-width="2" stroke-linejoin="round" stroke-linecap="round">
<!-- veil falling behind the shoulder -->
<path d="M96 92 L82 118 L84 182 Q85 202 95 204 L108 200 L106 140 L108 102Z" fill="#d8c194"/>
<path d="M94 126 Q93 162 95 194 M101 132 Q101 164 102 192" fill="none" stroke="#a8854f" stroke-width="1.5"/>
<!-- lower legs: weight on the right, the left relaxed and slanting -->
<path d="M94 480 L117 480 L121 512 Q125 532 122 547 L106 549 Q100 528 96 508Z" fill="#cf9464"/>
<path d="M145 482 L169 482 L166 516 Q168 536 162 549 L148 549 Q143 530 144 510Z" fill="#d9a06c"/>
<path d="M104 506 Q102 528 106 548 L114 547 Q111 526 112 508Z M152 512 Q150 532 150 548 L158 548 Q157 530 159 514Z" fill="#b97e52" stroke="none" opacity=".8"/>
<path d="M104 544 Q100 555 109 559 L139 559 Q142 555 132 549 Q121 541 112 542 L107 542Z" fill="#7c3a24"/>
<path d="M146 546 Q144 558 154 561 L188 560 Q191 556 182 550 Q170 542 160 543 L150 543Z" fill="#7c3a24"/>
<path d="M108 551 L132 552 M150 552 L180 552 M112 540 L120 547 M158 541 L166 548" fill="none" stroke="#4a2413" stroke-width="1.3"/>
<!-- neck -->
<path d="M110 106 L132 107 L134 141 L106 141 L108 118Z" fill="#cf9464"/>
<path d="M110 110 Q121 120 132 110 L133 124 Q121 132 109 122Z" fill="#b97e52" stroke="none"/>
<!-- drapery mass: the trabea -->
