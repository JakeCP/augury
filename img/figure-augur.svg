<path d="M200 184 L214 132 L235 55 Q239 37 252 37 Q265 37 265 50 Q265 61 254 61" fill="none" stroke="#5a3a22" stroke-width="6.2" stroke-linecap="round" transform="translate(-13 0)"/>
