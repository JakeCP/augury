<path d="M94 322 Q99 392 96 472 L109 472 Q107 394 106 324Z" opacity=".38"/>
<path d="M130 330 Q137 398 139 470 L152 468 Q147 396 142 328Z" opacity=".34"/>
<path d="M154 214 Q160 268 162 326 L172 324 Q169 264 164 212Z" opacity=".3"/>
