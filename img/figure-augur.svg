<path d="M203 128 Q203 114 214 112 Q225 112 226 124 L224 139 Q212 144 205 138Z" fill="#e0aa74" transform="translate(-13 0)"/>
<path d="M205 122 Q214 118 224 121 M205 130 Q214 126 224 129" fill="none" stroke="#8a5632" stroke-width="1.3" transform="translate(-13 0)"/>
</g>
<!-- head in profile, face lifted to the right -->
<g stroke="#4a2413" stroke-width="2" stroke-linejoin="round" stroke-linecap="round">
<path d="M118 50 Q134 52 140 66 L141 76 Q144 83 150 88 Q153 93 149 97 Q144 98 143 100 Q145 103 143 106 Q145 111 141 115 Q132 122 121 120 Q108 117 103 104 Q98 88 102 70 Q106 54 118 50Z" fill="#dda26e"/>
<path d="M139 69 Q145 82 147 89 Q143 87 141 79Z" fill="#ecc09a" stroke="none"/>
<path d="M136 63 Q124 51 109 57 Q121 54 131 62 Q135 66 136 72Z" fill="#4a2e1c"/>
<path d="M126 79 Q133 75 139 78" fill="none" stroke="#4a2e1c" stroke-width="2.2"/>
<path d="M127 85 Q132 81 138 84 Q132 88 127 85Z" fill="#f6ecd8"/>
<circle cx="134.5" cy="84" r="1.9" fill="#33200f" stroke="none"/>
<path d="M136 103 Q140 104 141 103" fill="none" stroke="#8a5632" stroke-width="1.5"/>
</g>
<!-- the veil over the head, capite velato -->
<g stroke="#4a2413" stroke-width="2" stroke-linejoin="round">
<path d="M140 66 Q138 42 118 36 Q94 31 84 52 Q76 68 82 98 L88 124 Q90 133 100 129 L105 124 L100 96 Q97 68 108 56 Q123 44 140 66Z" fill="#ecdcb8"/>
<path d="M91 60 Q104 45 123 45 M89 82 Q95 58 112 49" fill="none" stroke="#b89a62" stroke-width="1.7"/>
<path d="M139 64 Q122 45 109 57 Q98 69 101 95 L104 121" fill="none" stroke="#71313f" stroke-width="3.4"/>
<path d="M110 43 Q123 45 132 55" fill="none" stroke="#f8efdb" stroke-width="2.3"/>
</g>
</svg>
