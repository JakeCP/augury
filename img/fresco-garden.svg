<path d="M36 10 L44 12 L36 15Z" fill="#2a1a10"/><circle cx="32" cy="10" r="1.6" fill="#1d1410"/>
</g>
<!-- shrubs and grass at the fence line -->
<use href="#bush" transform="translate(46 322) scale(1.15)"/>
<use href="#bush" transform="translate(168 330) scale(-1.05 1)"/>
<use href="#bush" transform="translate(292 324)"/>
<use href="#bush" transform="translate(414 330) scale(-1.1 1)"/>
<use href="#bush" transform="translate(538 322) scale(1.15)"/>
<use href="#rose" transform="translate(104 318) scale(.9)"/><use href="#rose" transform="translate(352 316) scale(.9)"/><use href="#quince" transform="translate(474 320) scale(.8)"/>
<g stroke="#71824a" stroke-width="2" fill="none" stroke-linecap="round">
<path d="M118 342 Q116 330 110 324 M124 342 Q124 330 128 322 M258 342 Q256 331 250 325 M264 342 Q265 330 269 323 M502 342 Q500 331 494 325 M508 342 Q509 330 513 323"/>
</g>
<!-- low lattice fence across the front -->
<g stroke="#a87f3f" stroke-width="3.4" fill="none" stroke-linecap="round">
<path d="M0 344 H640 M0 374 H640"/>
<path d="M8 374 L38 344 M44 374 L74 344 M80 374 L110 344 M116 374 L146 344 M152 374 L182 344 M188 374 L218 344 M224 374 L254 344 M260 374 L290 344 M296 374 L326 344 M332 374 L362 344 M368 374 L398 344 M404 374 L434 344 M440 374 L470 344 M476 374 L506 344 M512 374 L542 344 M548 374 L578 344 M584 374 L614 344" opacity=".9"/>
<path d="M8 344 L38 374 M80 344 L110 374 M152 344 L182 374 M224 344 L254 374 M296 344 L326 374 M368 344 L398 374 M440 344 L470 374 M512 344 L542 374 M584 344 L614 374" opacity=".55"/>
</g>
<g stroke="#7a5a2b" stroke-width="5" fill="none"><path d="M22 340 V378 M162 340 V378 M322 340 V378 M482 340 V378 M618 340 V378"/></g>
<!-- a dove on the fence -->
<g transform="translate(226 292)">
<path d="M16 30 L2 48 L10 49 L24 35Z" fill="#9b958a"/>
<path d="M14 32 Q11 16 24 10 Q29 4 35 5 Q41 6 41 12 Q45 19 40 27 Q34 36 23 35 Q17 35 14 32Z" fill="#d8d0bf"/>
<path d="M20 16 Q29 12 35 18 Q30 26 22 25 Q18 20 20 16Z" fill="#a8a193"/>
<path d="M41 11 L49 13 L41 16Z" fill="#8f5a3a"/><circle cx="37" cy="11" r="1.6" fill="#1d1410"/>
<path d="M25 35 L24 42 M30 35 L31 42" stroke="#8f5a3a" stroke-width="1.6"/>
</g>
<!-- plinth -->
<rect x="0" y="378" width="640" height="42" fill="#e8dcc2"/>
<rect x="0" y="378" width="640" height="3" fill="#8f2a1c"/>
<rect x="0" y="384" width="640" height="1.6" fill="#d9a441"/>
<g stroke="#c9b78f" stroke-width="2"><path d="M128 386 V416 M256 386 V416 M384 386 V416 M512 386 V416"/></g>
<!-- plaster: a whisper of grain and two hairline cracks -->
<rect width="640" height="420" filter="url(#grain)"/>
<g stroke="#f6efdb" stroke-width="1.1" fill="none" opacity=".35"><path d="M58 0 Q66 60 54 118 M590 260 Q584 320 596 378"/></g>
<rect x="5" y="5" width="630" height="410" fill="none" stroke="#8f2a1c" stroke-width="2"/>
<rect x="10" y="10" width="620" height="400" fill="none" stroke="#d9a441" stroke-width="1"/>
</svg>
