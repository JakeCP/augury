<use href="#canopyA" transform="translate(196 88) scale(1.35)"/>
<use href="#canopyB" transform="translate(330 104) scale(-1.3 1.3)"/>
<use href="#canopyA" transform="translate(466 86) scale(-1.35 1.35)"/>
<use href="#canopyB" transform="translate(582 112) scale(1.2)"/>
<use href="#canopyA" transform="translate(120 184) scale(1.15)"/>
<use href="#canopyB" transform="translate(262 168) scale(-1.1 1.1)"/>
<use href="#canopyA" transform="translate(404 176) scale(1.12)"/>
<use href="#canopyB" transform="translate(536 186) scale(-1.08 1.08)"/>
<use href="#canopyA" transform="translate(48 252) scale(.95)"/>
<use href="#canopyB" transform="translate(196 242) scale(1)"/>
<use href="#canopyA" transform="translate(330 252) scale(-.98 .98)"/>
<use href="#canopyB" transform="translate(466 240) scale(-1 1)"/>
<use href="#canopyA" transform="translate(596 256) scale(.92)"/>
<!-- fruit and flowers dotted through the masses -->
<use href="#quince" transform="translate(96 142)"/><use href="#quince" transform="translate(238 118) scale(.9)"/>
<use href="#quince" transform="translate(372 146)"/><use href="#quince" transform="translate(506 122) scale(.9)"/>
<use href="#quince" transform="translate(168 222) scale(.85)"/><use href="#quince" transform="translate(444 216) scale(.85)"/>
<use href="#pom" transform="translate(150 176)"/><use href="#pom" transform="translate(418 108) scale(.95)"/>
<use href="#pom" transform="translate(556 200)"/><use href="#pom" transform="translate(288 206) scale(.9)"/>
<use href="#rose" transform="translate(66 206)"/><use href="#rose" transform="translate(316 138) scale(.9)"/>
<use href="#rose" transform="translate(492 262)"/><use href="#rose" transform="translate(226 272) scale(.9)"/>
<use href="#rose" transform="translate(584 150) scale(.85)"/>
<g fill="#f4ecd4"><circle cx="120" cy="262" r="2.6"/><circle cx="128" cy="256" r="2.2"/><circle cx="386" cy="268" r="2.6"/><circle cx="394" cy="262" r="2.2"/><circle cx="540" cy="112" r="2.4"/><circle cx="88" cy="96" r="2.4"/></g>
<!-- birds: swifts above, songbirds in the branches -->
<g fill="#2e3428"><use href="#swift" transform="translate(178 26)"/><use href="#swift" transform="translate(392 16) scale(.72)"/><use href="#swift" transform="translate(516 38) scale(.55)"/></g>
<use href="#perch" transform="translate(404 158) scale(1.5)"/>
<use href="#perch" transform="translate(128 226) scale(-.85 .85)"/>
<g transform="translate(508 238) scale(.72)">
<path d="M14 24 L3 40 L9 41 L20 28Z" fill="#3d2c1c"/>
<path d="M12 25 Q10 13 20 8 Q25 3 30 4 Q36 5 36 11 Q39 17 35 23 Q29 29 20 29 Q15 29 12 25Z" fill="#8a6a44"/>
