<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" role="img" aria-label="A painted garden wall: birds among laurel and fruit trees above a low lattice fence">
<title>A garden wall with birds, in the manner of a Roman fresco</title>
<!-- Original hand-built fresco panel (Phase 6, repainted): a garden
     room wall in the spirit of Livia's — dense layered foliage
     masses over a blue-green sky, painted not copied from any wall. -->
<defs>
<linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
<stop offset="0" stop-color="#aec6b8"/><stop offset=".45" stop-color="#cdd6b8"/>
<stop offset=".78" stop-color="#e6dcbe"/><stop offset="1" stop-color="#eee0c2"/>
</linearGradient>
<filter id="grain" x="0" y="0" width="100%" height="100%">
<feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="2" stitchTiles="stitch" result="n"/>
<feColorMatrix in="n" type="matrix" values="0 0 0 0 .23  0 0 0 0 .17  0 0 0 0 .1  0 0 0 .06 0"/>
</filter>
<path id="lf" d="M0 0 Q6 -6 14 0 Q6 5 0 0Z"/>
<g id="spray">
<use href="#lf" transform="rotate(-28)"/><use href="#lf" transform="translate(9 -7) rotate(8)"/>
<use href="#lf" transform="translate(4 7) rotate(-62)"/><use href="#lf" transform="translate(16 2) rotate(34)"/>
<use href="#lf" transform="translate(-6 -4) rotate(-100)"/><use href="#lf" transform="translate(12 10) rotate(-16)"/>
<use href="#lf" transform="translate(22 -6) rotate(58)"/><use href="#lf" transform="translate(-2 12) rotate(-38)"/>
</g>
<g id="canopyA">
<ellipse cx="0" cy="0" rx="58" ry="40" fill="#46562f"/>
<ellipse cx="-34" cy="10" rx="40" ry="28" fill="#3e4f2a"/>
<ellipse cx="36" cy="8" rx="42" ry="30" fill="#556838"/>
<ellipse cx="-16" cy="-18" rx="38" ry="24" fill="#5f7340"/>
<ellipse cx="22" cy="-16" rx="34" ry="22" fill="#71824a"/>
<ellipse cx="-40" cy="-8" rx="26" ry="17" fill="#7d8e52"/>
<ellipse cx="8" cy="14" rx="36" ry="20" fill="#4c5e34"/>
<ellipse cx="-6" cy="-26" rx="22" ry="13" fill="#93a45e"/>
<ellipse cx="40" cy="-4" rx="20" ry="12" fill="#93a45e" opacity=".85"/>
<g fill="#829254"><use href="#spray" transform="translate(-38 -20) scale(1.15)"/><use href="#spray" transform="translate(18 -30) scale(1.05) rotate(24)"/></g>
<g fill="#a8b06e"><use href="#spray" transform="translate(-10 -12) scale(.85) rotate(-18)"/><use href="#spray" transform="translate(34 12) scale(.8) rotate(40)"/></g>
<g fill="#33411f"><use href="#spray" transform="translate(-30 18) scale(.9) rotate(14)"/></g>
</g>
<g id="canopyB">
<ellipse cx="0" cy="0" rx="52" ry="44" fill="#506033"/>
<ellipse cx="-30" cy="-12" rx="34" ry="26" fill="#5f7340"/>
<ellipse cx="30" cy="-10" rx="36" ry="27" fill="#43542b"/>
<ellipse cx="0" cy="18" rx="40" ry="24" fill="#5a6c38"/>
<ellipse cx="-36" cy="14" rx="24" ry="16" fill="#71824a"/>
<ellipse cx="34" cy="16" rx="22" ry="14" fill="#7d8e52"/>
<ellipse cx="-8" cy="-28" rx="24" ry="14" fill="#8a9c58"/>
<g fill="#93a45e"><use href="#spray" transform="translate(-30 -26) rotate(-14)"/><use href="#spray" transform="translate(20 -24) scale(.9) rotate(30)"/></g>
<g fill="#b3ba7d"><use href="#spray" transform="translate(-4 -6) scale(.75) rotate(-34)"/></g>
<g fill="#3a4a24"><use href="#spray" transform="translate(10 24) scale(.95) rotate(20)"/></g>
</g>
<g id="bush">
<ellipse cx="0" cy="0" rx="44" ry="20" fill="#4c5e34"/>
<ellipse cx="-26" cy="-6" rx="26" ry="14" fill="#5f7340"/>
<ellipse cx="24" cy="-7" rx="27" ry="14" fill="#556838"/>
<ellipse cx="0" cy="-13" rx="24" ry="11" fill="#71824a"/>
<g fill="#93a45e"><use href="#spray" transform="translate(-22 -16) scale(.8)"/><use href="#spray" transform="translate(14 -15) scale(.75) rotate(26)"/></g>
</g>
<g id="pom"><path d="M0 -6 L2 -9 L4 -6 L6 -9 L7 -5 Q11 -1 9 4 Q7 9 1 9 Q-5 9 -7 4 Q-9 -2 -4 -5 Q-2 -7 0 -6Z" fill="#a03324"/><circle cx="-3" cy="1" r="2" fill="#c0503c"/></g>
<g id="quince"><circle r="6.5" fill="#d9a441"/><circle cx="-2" cy="-2" r="2" fill="#ecc26a"/><path d="M0 -6 Q1 -9 4 -10" stroke="#5f4a26" stroke-width="1.4" fill="none"/></g>
<g id="rose"><circle cx="-3.4" cy="0" r="3.2" fill="#c97b6a"/><circle cx="3.4" cy="0" r="3.2" fill="#c97b6a"/><circle cx="0" cy="-3.4" r="3.2" fill="#d48d7c"/><circle cx="0" cy="3.2" r="3" fill="#bd6a58"/><circle r="1.7" fill="#e8c26a"/></g>
<g id="swift"><path d="M1 13 Q14 1 24 10 Q27 6 31 10 Q41 1 53 13 Q41 9 30 15 Q27 17 24 15 Q13 9 1 13Z"/></g>
<g id="perch">
<path d="M16 26 L2 46 L9 47 L22 31Z" fill="#4a3826"/>
<path d="M14 28 Q11 14 23 8 Q28 2 34 3 Q41 4 41 10 Q45 16 41 24 Q36 33 25 33 Q17 33 14 28Z" fill="#7a5a3a"/>
<path d="M22 32 Q30 28 34 19 Q35 28 29 33 Q25 34 22 32Z" fill="#f0e2c4"/>
<path d="M19 14 Q28 10 35 15 Q31 24 22 24 Q17 19 19 14Z" fill="#3d2c1c"/>
<circle cx="23" cy="19" r="1.5" fill="#f0e2c4"/><circle cx="28" cy="16" r="1.3" fill="#f0e2c4"/>
<path d="M41 9 L50 11 L41 14Z" fill="#2a1a10"/><circle cx="37" cy="9" r="1.7" fill="#1d1410"/>
<path d="M25 33 L24 39 M30 33 L31 39" stroke="#2a1a10" stroke-width="1.6" fill="none"/>
</g>
</defs>
<rect width="640" height="420" fill="url(#sky)"/>
<!-- distant garden: soft crowns and cypress tips on the horizon -->
<g fill="#93a67c" opacity=".8">
<ellipse cx="60" cy="128" rx="86" ry="34"/><ellipse cx="210" cy="112" rx="100" ry="38"/>
<ellipse cx="380" cy="120" rx="96" ry="34"/><ellipse cx="540" cy="110" rx="104" ry="40"/>
</g>
<g fill="#6d8156" opacity=".85">
<path d="M146 150 Q138 84 150 44 Q162 84 156 150Z"/><path d="M478 148 Q470 80 483 38 Q495 80 489 148Z"/>
<path d="M312 142 Q306 92 315 58 Q324 92 319 142Z"/>
</g>
<ellipse cx="320" cy="320" rx="340" ry="70" fill="#e9dcbc" opacity=".55"/>
