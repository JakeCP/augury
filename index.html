<noscript><div class="view"><h1>Augury needs JavaScript</h1>
<p>The rite is this: choose your tradition (Roman favours the left, Greek the right), mark a <em lang="la">templum</em> in the sky and face your front, name the signs you ask for, then watch in silence. Ravens favour the right, crows and woodpeckers the left. An eagle-owl by daylight forbids outright. No sign means <em lang="la">ALIO DIE</em> — on another day.</p>
<p>The instrument — compass, sky-dome and record — runs entirely on your device and needs JavaScript. The About page explains what is attested and what we reconstructed. For reflection and delight, not advice.</p></div></noscript>
</main>

<script>(function(){var b=document.getElementById('theme-cycle');var order=['auto','light','dark'];function cur(){try{var t=JSON.parse(localStorage.getItem('augury:theme')||'"auto"');return order.includes(t)?t:'auto';}catch(e){return 'auto';}}function paint(){var c=cur();b.textContent=c==='auto'?'Auto':c==='light'?'Light':'Dark';b.setAttribute('aria-label','Colour theme: '+b.textContent+'. Activate to change.');if(c==='auto')delete document.documentElement.dataset.theme;else document.documentElement.dataset.theme=c;}b.addEventListener('click',function(){var n=order[(order.indexOf(cur())+1)%3];try{localStorage.setItem('augury:theme',JSON.stringify(n));}catch(e){}paint();});paint();})();</script>
